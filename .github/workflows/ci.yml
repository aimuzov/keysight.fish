name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: fish ${{ matrix.fish }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            fish: latest
          - os: macos-latest
            fish: latest
          # The oldest release the plugin claims to support
          - os: ubuntu-latest
            fish: "4.0.0"

    steps:
      - uses: actions/checkout@v5

      - name: Install fish from the release PPA
        if: runner.os == 'Linux' && matrix.fish == 'latest'
        run: |
          sudo add-apt-repository -y ppa:fish-shell/release-4
          sudo apt-get update
          sudo apt-get install -y fish

      - name: Install fish from homebrew
        if: runner.os == 'macOS'
        run: brew install fish

      # fish is written in Rust since 4.0, and the runner image does not carry a toolchain
      - name: Install Rust
        if: matrix.fish != 'latest'
        uses: dtolnay/rust-toolchain@stable

      - name: Build fish from source
        if: matrix.fish != 'latest'
        env:
          FISH_VERSION: ${{ matrix.fish }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gettext libpcre2-dev
          git clone --depth 1 --branch "$FISH_VERSION" https://github.com/fish-shell/fish-shell
          # The Corrosion release vendored by fish 4.0 cannot discover a toolchain through
          # today's rustup, so the compiler is pointed at directly
          cmake -S fish-shell -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DRust_COMPILER="$(rustup which rustc)" -DRust_CARGO="$(rustup which cargo)"
          cmake --build build
          sudo cmake --install build

      - name: Report the version under test
        run: fish --version

      - name: Check the syntax of every fish file
        run: fish --no-config -n functions/*.fish completions/*.fish tests/*.fish

      - name: Install fishtape
        run: |
          fish -c 'curl -sSL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source
                   fisher install jorgebucaran/fisher jorgebucaran/fishtape'

      - name: Run the tests
        run: fish -c 'fishtape tests/*.test.fish'
